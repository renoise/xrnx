name: Build and Archive XRNX_Starter_Pack.zip

on:
  pull_request:
    branches: [ "master" ]
  push:
    branches:
      - master

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          submodules: recursive
            
      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with: 
          cache-workspaces: "docs"
          cache-key: "renoise-xrnx"

      - name: Install mdbook
        run: cargo install mdbook@0.5

      - name: Build the API
        run: cargo run

      - name: Build the book
        run: mdbook build

      - name: Validate links
        uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress --offline --root-dir "$GITHUB_WORKSPACE/book" book
          fail: true

      - name: Create XRNX_Starter_Pack
        run: |
          mkdir dist
          cp -rf definitions dist/definitions
          cp -rf book dist/docs
          cp -rf tools dist/tools
          rm -rf dist/*/.git dist/*/.gitignore
          echo -e '<html>\n<body>\n<script type="text/javascript">\n\twindow.location.href = "./docs/index.html";\n</script>\n</body>\n</html>' > dist/docs.html 
        
      - name: Archive
        uses: actions/upload-artifact@v4
        with:
          name: XRNX_Starter_Pack
          path: dist
